<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} | Продуктовая компания</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/vendor/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-light bg-light"><div class="container d-flex flex-wrap gap-3">
    <a class="navbar-brand" href="{{ url_for('main.index') }}">Продуктовая компания</a>
    <a href="{{ url_for('main.about') }}">О модели</a>
    <a href="{{ url_for('main.documents') }}">Документация</a>
</div></nav>
<main class="container py-4">
{% with messages = get_flashed_messages() %}{% for message in messages %}<p class="alert alert-info">{{ message }}</p>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/spinner.js') }}" defer></script>
</body>
</html>
